services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: sm_task1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: