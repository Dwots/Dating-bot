services:

  postgres:
    image: postgres:16-alpine
    container_name: dating_bot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dating_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dating_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # redis-cli ping возвращает PONG если всё ок
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dating_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # порт для подключения приложений (AMQP протокол)
      - "15672:15672"  # порт веб-интерфейса (Management UI)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dating_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # server /data — папка где хранятся файлы
    # --console-address — на каком порту веб-интерфейс
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API (сюда обращается boto3)
      - "9001:9001"   # веб-интерфейс MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5

  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: dating_surreal
    # --user, --pass — логин/пароль
    # --bind — на каком адресе слушать
    # memory — хранить данные в памяти (для прода нужен file:// или tikv://)
    command: start --user root --pass root --bind 0.0.0.0:8000 memory
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: dating_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dating_bot
      # новые переменные — имена сервисов внутри docker-сети
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: root
      SURREAL_PASS: root
      MINIO_BUCKET: profiles
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      surrealdb:
        condition: service_started
    restart: unless-stopped

    # Celery воркер — выполняет задачи
  celery_worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: dating_celery_worker
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dating_bot
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # запускаем воркер на двух очередях
    command: celery -A celery_app worker --loglevel=info -Q celery,ratings,notifications

  # Celery Beat — планировщик расписания
  celery_beat:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: dating_celery_beat
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dating_bot
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - celery_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info

  # Consumer — слушает очередь match и триггерит уведомления
  match_consumer:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: dating_match_consumer
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dating_bot
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      celery_worker:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: python consumer.py

    # Prometheus — сбор метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: dating_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana — визуализация метрик
  grafana:
    image: grafana/grafana:latest
    container_name: dating_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
  
  benchmark:
    build:
      context: ./benchmark
      dockerfile: Dockerfile
    container_name: dating_benchmark
    depends_on:
      - bot
      - prometheus
    network_mode: host  # чтобы видеть localhost:8001
    profiles:
      - test  # запускается только с флагом --profile test

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: dating_admin
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dating_bot
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: profiles
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
